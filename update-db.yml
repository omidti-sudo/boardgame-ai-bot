name: Update BGG database (weekly)
on:
  schedule:
    - cron: "0 8 * * 0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - run: python3 update_games.py
      - run: |
          git config user.name "boardgame-ai-updater"
          git config user.email "updater@boardgame-ai.local"
          git add games.json
          git diff --cached --quiet || git commit -m "Weekly BGG database update"
          git push
